    <script>
      const swiper = new Swiper(".mySwiper", {
        loop: true,
        navigation: {
          nextEl: ".swiper-button-next",
          prevEl: ".swiper-button-prev",
        },
        keyboard: {
          enabled: true,
        },
      });

      // Fancybox初期化（自動でギャラリー機能ON）
      Fancybox.bind('[data-fancybox="gallery"]', {
        keyboard: {
          Escape: "close",
          Delete: "close",
          ArrowRight: "next",
          ArrowLeft: "prev",
        },
        on: {
          destroy: () => {
            swiper.keyboard.enable(); // モーダル閉じたらキーボード制御戻す
          },
          init: () => {
            swiper.keyboard.disable(); // モーダル開いてる間はSwiperのキーボードを一時無効
          },
        },
      });
