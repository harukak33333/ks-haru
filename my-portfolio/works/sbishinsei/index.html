<!doctype html>
<html lang="ja">
  <head>
    <script src="/assets/js/auth.js"></script>
    <meta charset="UTF-8" />
    <title>SBI Shinsei International Limited | Haruka Kashima</title>
    <meta
      name="description"
      content="UI/UXデザイナー・Webデザイナー、鹿島遥のポートフォリオサイト。WebサイトやデジタルプロダクトのUI/UXデザイン、アートディレクションなど、これまでの制作実績をご紹介します。"
    />
    <meta name="auther" content="Haruka Kashima" />
    <link rel="icon" href="/assets/img/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow, noarchive" />
    <base href="/en/my-portfolio/" />
    <meta property="og:image" content="/assets/img/ogp.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&family=Marcellus&family=Noto+Sans+JP:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fancyapps/ui/dist/fancybox/fancybox.css"
    />
    <link rel="stylesheet" href="/assets/css/destyle.css" />
    <link rel="stylesheet" href="/assets/css/styles.css" />
    <link rel="stylesheet" href="/assets/css/layout.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
  </head>
  <body>
    <header id="header"></header>
    <main class="l-main c-main">
      <section class="l-section c-hero">
        <div class="l-container">
          <div class="c-hero__heading">
            <h1 class="c-hero__title">SBI Shinsei corporate website</h1>
            <p class="c-hero__meta">SBI Shinsei International Limited</p>
          </div>
          <figure class="c-media c-media--hero">
            <img src="/assets/img/en-sbishinsei-kv.webp" />
          </figure>
        </div>
      </section>
      <section class="project-content">
        <div class="grid two-col">
          <article>
            <h2>Summary</h2>
            <p>
              SBI新生銀行のロンドン拠点のWEBサイト立ち上げプロジェクト。英語版に適したレイアウトやコンテンツ構成を優先して制作した。サイト構成は必要な情報をトップページにまとめ、CMSは導入せず静的に実装。
            </p>
          </article>
          <aside>
            <article>
              <h2>Links</h2>

              <ul>
                <li>
                  <a href="https://www.sbishinsei.co.uk/" target="_blank"
                    >https://www.sbishinsei.co.uk/</a
                  >
                </li>
              </ul>
            </article>
          </aside>
        </div>
        <article>
          <h2>My Contributions</h2>
          <p>UIデザイン / ページデザイン</p>
        </article>
        <article>
          <div class="swiper mySwiper">
            <div class="swiper-wrapper">
              <div class="swiper-slide">
                <a
                  data-fancybox="gallery"
                  href="/assets/img/sbishinsei-01.webp"
                >
                  <img src="/assets/img/sbishinsei-01.webp" alt="img1" />
                </a>
              </div>
              <div class="swiper-slide">
                <a
                  data-fancybox="gallery"
                  href="/assets/img/sbishinsei-02.webp"
                >
                  <img src="/assets/img/sbishinsei-02.webp" alt="img2" />
                </a>
              </div>
              <div class="swiper-slide">
                <a
                  data-fancybox="gallery"
                  href="/assets/img/sbishinsei-03.webp"
                >
                  <img src="/assets/img/sbishinsei-03.webp" alt="img3" />
                </a>
              </div>
              <div class="swiper-slide">
                <a
                  data-fancybox="gallery"
                  href="/assets/img/sbishinsei-04.webp"
                >
                  <img src="/assets/img/sbishinsei-04.webp" alt="img3" />
                </a>
              </div>
            </div>
            <!-- ナビゲーション矢印 -->
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
          </div>
        </article>
      </section>
    </main>

    <div class="arrow-outer">
      <button id="back-to-top" class="arrow"></button>
    </div>
    <footer id="footer"></footer>
    <script src="/assets/js/common.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui/dist/fancybox/fancybox.umd.js"></script>
    <script>
      const swiper = new Swiper(".mySwiper", {
        loop: true,
        navigation: {
          nextEl: ".swiper-button-next",
          prevEl: ".swiper-button-prev",
        },
        keyboard: {
          enabled: true,
        },
      });

      // Fancybox初期化（自動でギャラリー機能ON）
      Fancybox.bind('[data-fancybox="gallery"]', {
        keyboard: {
          Escape: "close",
          Delete: "close",
          ArrowRight: "next",
          ArrowLeft: "prev",
        },
        on: {
          destroy: () => {
            swiper.keyboard.enable(); // モーダル閉じたらキーボード制御戻す
          },
          init: () => {
            swiper.keyboard.disable(); // モーダル開いてる間はSwiperのキーボードを一時無効
          },
        },
      });
    </script>
  </body>
</html>
